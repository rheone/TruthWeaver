name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer reads the Git tags and the commit history to derive the package version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore TruthWeaver.slnx --locked-mode

      - name: Build
        # This step doubles as the AOT/trim compatibility gate: every project under src/
        # (src/Directory.Build.props) has IsAotCompatible enabled, which turns on the trim
        # analyzer (IL2xxx) and NativeAOT analyzer (IL3xxx) for the shipping library packages,
        # and src/Directory.Build.props promotes their warnings to build errors whenever the
        # standard $CI=true environment variable that GitHub Actions sets is present - so a
        # newly introduced reflection/dynamic-code pattern in a shipping package fails this
        # step on any PR. Test and benchmark projects are outside src/ and are unaffected.
        run: dotnet build TruthWeaver.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TruthWeaver.slnx --configuration Release --no-build

      - name: CSharpier
        run: dotnet csharpier check .

      - name: dotnet format
        run: dotnet format TruthWeaver.slnx --no-restore --verify-no-changes --severity info

      - name: Roslynator
        # Compiler diagnostics are skipped: the Build step already fails on them, and Roslynator's own workspace cannot
        # run the TruthWeaver.Generators source generator (it needs a newer Roslyn), so it would report the generated
        # code as missing in the generator tests.
        run: dotnet roslynator analyze TruthWeaver.slnx --ignore-compiler-diagnostics

      - name: Text normalization
        # Same check as scripts/format-all.cs: UTF-8, LF, ASCII dashes and quotes, no hidden characters.
        run: dotnet run scripts/normalize-text.cs -- --check-only

      - name: JSON and YAML formatting
        # Prettier is pinned in scripts/format-data.cs; the runner image provides Node.js.
        run: dotnet run scripts/format-data.cs -- --check-only

  pack:
    # Packs every package and checks it. This job never pushes or publishes: it has no NuGet API key and only
    # contents: read permission. The pack output stays in the runner's temp directory.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer reads the Git tags and the commit history to derive the package version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TruthWeaver.slnx --locked-mode

      - name: Pack
        # -warnaserror turns a pack warning (a NuGet NU* warning or a package validation finding) into a failure.
        # EnablePackageValidation (src/Directory.Build.props) runs during this step. CI=true is set by GitHub Actions
        # and makes the build deterministic (ContinuousIntegrationBuild).
        run: dotnet pack TruthWeaver.slnx --configuration Release --no-restore -warnaserror --output "$RUNNER_TEMP/packages"

      - name: Check packages
        run: dotnet run scripts/check-packages.cs -- "$RUNNER_TEMP/packages"

  devcontainer:
    # Builds the dev image and checks that its SDK is the one global.json pins, so the container cannot drift from CI.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag truthweaver-dev .devcontainer

      - name: Check SDK version
        run: |
          expected=$(jq -r .sdk.version global.json)
          actual=$(docker run --rm truthweaver-dev dotnet --version)
          test "$expected" = "$actual" || { echo "global.json pins $expected but the image has $actual"; exit 1; }

      - name: Check tools
        run: docker run --rm truthweaver-dev bash -c 'rg --version && gh --version && pwsh -v && zsh --version && codegraph --version'
