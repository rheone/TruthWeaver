name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore TruthWeaver.slnx --locked-mode

      - name: Build
        # This step doubles as the AOT/trim compatibility gate: every project under src/
        # (src/Directory.Build.props) has IsAotCompatible enabled, which turns on the trim
        # analyzer (IL2xxx) and NativeAOT analyzer (IL3xxx) for the shipping library packages,
        # and src/Directory.Build.props promotes their warnings to build errors whenever the
        # standard $CI=true environment variable that GitHub Actions sets is present - so a
        # newly introduced reflection/dynamic-code pattern in a shipping package fails this
        # step on any PR. Test and benchmark projects are outside src/ and are unaffected.
        run: dotnet build TruthWeaver.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TruthWeaver.slnx --configuration Release --no-build

      - name: CSharpier
        run: dotnet csharpier check .

      - name: dotnet format
        run: dotnet format TruthWeaver.slnx --no-restore --verify-no-changes --severity info

      - name: Roslynator
        run: dotnet roslynator analyze TruthWeaver.slnx
