name: Release

# Publishes TruthWeaver to NuGet.org when a tag with the prefix v is pushed.
# workflow_dispatch is a dry run: it runs verify and pack on the chosen ref and never publishes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # MinVer reads the Git tags and the commit history to derive the package version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          # The tagged commit must be reachable from main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on a commit in main."
            exit 1
          fi

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore TruthWeaver.slnx --locked-mode

      - name: Check the version
        if: github.ref_type == 'tag'
        run: |
          # MinVer must make the version from the tag. Both values are the tag without the prefix v.
          version="$(dotnet msbuild src/TruthWeaver -t:MinVer -getProperty:PackageVersion | tr -d '[:space:]')"
          expected="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$expected" ]; then
            echo "::error::MinVer made version '$version' but the tag is '$expected'."
            exit 1
          fi

      - name: Build
        run: dotnet build TruthWeaver.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TruthWeaver.slnx --configuration Release --no-build

      - name: CSharpier
        run: dotnet csharpier check .

      - name: dotnet format
        run: dotnet format TruthWeaver.slnx --no-restore --verify-no-changes --severity info

      - name: Roslynator
        run: dotnet roslynator analyze TruthWeaver.slnx --ignore-compiler-diagnostics

      - name: Text normalization
        run: dotnet run scripts/normalize-text.cs -- --check-only

      - name: JSON and YAML formatting
        run: dotnet run scripts/format-data.cs -- --check-only

  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TruthWeaver.slnx --locked-mode

      - name: Pack
        # -warnaserror turns a pack warning into a failure. CI=true makes the build deterministic.
        run: dotnet pack TruthWeaver.slnx --configuration Release --no-restore -warnaserror --output "$RUNNER_TEMP/packages"

      - name: Check packages
        run: dotnet run scripts/check-packages.cs -- "$RUNNER_TEMP/packages"

      - name: Validate SourceLink and determinism
        run: |
          dotnet tool install dotnet-validate --version 0.0.1 --tool-path "$RUNNER_TEMP/tools"
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            # TruthWeaver.Generators is analyzer-only: it has no lib assembly for the tool to check.
            case "$package" in *TruthWeaver.Generators.*) continue ;; esac
            "$RUNNER_TEMP/tools/dotnet-validate" package local "$package"
          done

      - name: Hold back unpublished packages
        # The terminal UI tool (TruthWeaver.Tool.Tui) is packed and checked above, but it is not published yet
        # (docs/tui.md). Removing it here keeps it out of the uploaded packages, the provenance, the push and the GitHub release.
        run: rm -f "$RUNNER_TEMP"/packages/TruthWeaver.Tool.Tui.*

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg
          if-no-files-found: error

  publish:
    needs: [verify, pack]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The nuget environment requires manual approval (repository settings).
    environment: nuget
    permissions:
      contents: read
      # Trusted publishing: the OIDC token is exchanged for a short-lived NuGet.org key. The same token signs
      # the build provenance. No other job has id-token: write.
      id-token: write
      attestations: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Attest build provenance
        # Provenance covers the exact files that pack built and uploaded. The publish job makes it because
        # it is the only job that may request an OIDC token (id-token: write).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packages/*.nupkg
            packages/*.snupkg

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The NuGet.org profile name that owns the trusted publishing policy (repository variable).
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # A .nupkg push also pushes the .snupkg next to it. --skip-duplicate makes a re-run safe.
        run: dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen (v1.2.0-rc.1) is a pre-release.
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags
